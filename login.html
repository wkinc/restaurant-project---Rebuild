<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — Rebuild with no Co.</title>
<link rel="stylesheet" href="resource/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Staff login</h1>
    <div class="sub">Access orders and kitchen inventory.</div>
    <div class="demo-hint">Demo credentials — user: <strong>test</strong> · password: <strong>test</strong></div>

    <div class="field"><label>Username</label><input id="username" autocomplete="off"></div>
    <div class="field"><label>Password</label><input id="password" type="password"></div>
    <button class="primary" id="loginBtn">Log in</button>
    <div class="error" id="loginError">Incorrect username or password.</div>
  </div>
</div>

<script src="resource/login.js"></script>
</body>
</html>
