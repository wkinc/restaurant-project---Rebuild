<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Woodfire & Co.</title>
<link rel="stylesheet" href="resource/style.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html">Woodfire &amp; Co.</a>
  <div class="nav-links"><button class="logout" id="logoutBtn">Log out</button></div>
</nav>

<div class="admin-wrap">
  <div class="admin-head">
    <h1 style="font-size:26px;">Kitchen dashboard</h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="orders">Customer Orders</button>
    <button class="tab" data-tab="restock">Restock</button>
  </div>

  <div class="panel-view active" id="ordersPanel">
    <div id="ordersList"></div>
  </div>

  <div class="panel-view" id="restockPanel">
    <table>
      <thead><tr><th>Item</th><th>On hand</th><th>Par</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="actions">
      <button class="primary" style="width:auto; margin-top:0;" id="askBtn">Get restock recommendations</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script src="resource/admin.js"></script>
</body>
</html>
